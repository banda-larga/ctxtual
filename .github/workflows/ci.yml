name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        extras: ["core", "mcp"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      # "core" checks the library still works with no dependencies at all.
      - name: Install dependencies (core)
        if: matrix.extras == 'core'
        run: uv sync --extra dev

      - name: Install dependencies (mcp)
        if: matrix.extras == 'mcp'
        run: uv sync --extra dev --extra mcp

      - name: Lint
        run: uv run ruff check src/ tests/ benchmarks/

      - name: Run tests
        run: uv run pytest --tb=short -q -W error::DeprecationWarning
