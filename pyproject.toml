[project]
name = "ctxtual"
version = "0.5.0"
description = "Keep large tool results out of the context window: offload them from any MCP server, or store them from your own agent tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edoardo Federici" }]
keywords = ["ai", "agents", "llm", "context", "tools", "mcp", "fastmcp", "mcp-proxy", "context-engineering", "claude", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
mcp = [
    "fastmcp>=4.1,<5",
    "tomlkit>=0.13",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "coverage>=7.0",
    "ruff>=0.8",
]

[project.scripts]
ctxtual = "ctxtual.cli:main"

[project.urls]
Homepage = "https://github.com/banda-larga/ctxtual"
Repository = "https://github.com/banda-larga/ctxtual"
Documentation = "https://github.com/banda-larga/ctxtual#readme"
Issues = "https://github.com/banda-larga/ctxtual/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxtual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["ctxtual"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM",
    "C4", "PIE", "PERF", "RUF", "ASYNC", "PLE", "LOG", "T10", "DTZ", "PT",
]
# E501: the formatter sets line length; it leaves long strings and comments.
# PT018: `assert a and b` in tests is clear enough.
# PERF401: an explicit loop is often the clearer way to build a list.
ignore = ["E501", "PT018", "PERF401"]
# Typographic characters used on purpose in text and docs.
allowed-confusables = ["–", "σ", "×"]

[tool.ruff.lint.per-file-ignores]
# Notebooks import after explaining what they import.
"*.ipynb" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
]
